name: backup-check
on:
  schedule:
    - cron: "37 11 * * *"   # 11:37 UTC = 6:37 Miami (EST); el backup del server corre antes
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar backup del día
        run: |
          TODAY=$(date -u +%F)
          F="backups/hs-ops-backup-${TODAY}.zip.age"
          test -f "$F" || { echo "::error::Falta $F"; exit 1; }
          SIZE=$(stat -c %s "$F")
          [ "$SIZE" -gt 1024 ] || { echo "::error::$F pesa ${SIZE} bytes"; exit 1; }
          echo "OK: $F (${SIZE} bytes)"
